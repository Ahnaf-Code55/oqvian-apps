<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/oqvian-apps/signal/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIGNAL — Screen Time Budget</title>
  <meta name="description" content="A screen-time budget that pays you back: save the minutes you don't burn and spend them on rewards you choose. No streaks. No shame.">
  <meta name="theme-color" content="#0A0B0F">
  <meta name="color-scheme" content="dark">

  <!-- Social -->
  <meta property="og:title" content="SIGNAL — Screen Time Budget">
  <meta property="og:description" content="Save the minutes you don't burn and spend them on rewards you choose.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIGNAL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0A0B0F;
      color: #F0F1E9;
      height: 100%;
      overscroll-behavior: none;
    }
    #signal-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 600px at -10% 0%, rgba(182,255,59,.10), transparent 60%),
        #0A0B0F;
      transition: opacity .4s ease;
      z-index: 10;
    }
    #signal-splash .box { display: grid; place-items: center; gap: 18px; }
    #signal-splash .mark {
      width: 56px; height: 56px; border-radius: 16px; background: #B6FF3B;
      display: grid; place-items: center;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #signal-splash .wordmark {
      font-family: "Space Grotesk", Inter, system-ui, sans-serif;
      font-weight: 700; letter-spacing: .3em; font-size: 15px; color: #F0F1E9;
      padding-left: .3em;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.92); opacity: .75; }
    }
    @media (prefers-reduced-motion: reduce) {
      #signal-splash .mark { animation: none; }
    }
  </style>
</head>
<body style="margin:0;background:#0A0B0F;color:#F0F1E9">
  <div id="signal-splash" aria-hidden="true">
    <div class="box">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0A0B0F"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M4 14v-3M9 18V6M14 16v-6M19 13V8"/>
        </svg>
      </div>
      <div class="wordmark">SIGNAL</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove the splash once Flutter paints, so first load is dark, not white.
    (function () {
      var splash = document.getElementById('signal-splash');
      if (!splash) return;
      function dismiss() {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 420);
      }
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
          clearInterval(timer);
          dismiss();
        } else if (tries > 60) {
          clearInterval(timer);
          dismiss();
        }
      }, 120);
    })();
  </script>
</body>
</html>
